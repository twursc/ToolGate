services:
  mcai-mcp-gateway:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      - "${MCP_PORT:-3001}:${MCP_PORT:-3001}"
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  gateway-data:
